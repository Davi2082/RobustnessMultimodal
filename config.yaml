# Tunable settings for the RobustnessMultimodal pipeline.
# configuration_files/configuration.py loads this file, some parameters
# can be overridden in each used script, but unless specified all parameters
# are taken from this file.

# Pipeline parameters - run_scripts.sh
overwrite: 1
rand_seed: [42, 43, 44]  # test-subset seeds (one value or a list); run_scripts.sh runs once per seed -> results/<ds>/200/<seed>/
train_seed: 42  # models, fusion heads and threshold folds; fixed across test subsets
attack_seed: 0  # fixed per-sample attack seed (seed + sample index); null = unseeded

train_pipeline: 0
clean_pipeline: 1
ablation_pipeline: 1
adversarial_pipeline: 1

datasets:
  - Fakeddit

pipeline_fusion_modes: [feature-fusion, min, mean, max, svm-rbf, linear] # Full list: [feature-fusion, min, mean, max, svm-rbf, linear]
pipeline_train: [svm-rbf, linear] # Full list: image, text, feature-fusion, svm-rbf, linear
pipeline_attacks: [pgd, trepat, sum, interleaved] # Full list: [pgd, trepat, sum, interleaved, joint]
attack_labels:
  pgd: PGD
  trepat: TREPAT
  sum: PGD+TREPAT
  interleaved: Interleaved
  joint: Joint
late_fusion_budget_divisor: 2  # 'both' splits the budget across the two modalities

# Models
name_llm: TinyLlama/TinyLlama-1.1B-Chat-v1.0
name_img_embed: openai/clip-vit-base-patch32
batch_size: 128
n_tokens: 256
# Decision threshold on P(Real) (predict Real iff score > threshold):
#   a number, e.g. 0.5, used by every method; or
#   calibrated: one threshold per method, tuned on the validation split (ROC on
#     both classes, Real = positive) so that FPR = share of Fake predicted Real
#     <= threshold_fpr; stored in checkpoints/<ds>/thresholds.json, written by
#     scripts/main_scripts/compute_thresholds.py.
threshold: calibrated
threshold_fpr: 0.10

# Per-dataset settings: CUDA devices + checkpoint filenames (relative to
# checkpoints/<dataset>/).
dataset_configs:
  Recovery:
    devices: [cuda:1]  # multiple GPUs shard attack samples for parallel speedup
    device_mlm: cuda:1  # fallback for standalone unimodal text attack (ignored when sharding)
    subset_size: 200   # null = full dataset (283 test samples)
    balanced_subset: true # only used when subset_size is not null
    text_checkpoint: clip-vit-large-patch14_None_8_8_0.4_True10_best_txt_only.pt
    image_checkpoint: clip-vit-base-patch32_None_8_8_0.4_True10_best_img_only.pt
    ff_checkpoint: clip-vit-base-patch32_None_8_8_0.4_True10_best.pt
  Fakeddit:
    devices: [cuda:1, cuda:2]
    device_mlm: cuda:2
    subset_size: 200    # balanced across classes when balanced_subset is true
    balanced_subset: true
    text_checkpoint: clip-vit-base-patch32_None_8_8_0.4_True10_best_txt_only.pt
    image_checkpoint: clip-vit-base-patch32_None_8_8_0.4_True10_best_img_only.pt
    ff_checkpoint: clip-vit-base-patch32_None_8_8_0.4_True10_best.pt

# Training parameters (neural models: text, image, feature-fusion)
training_neural:
  epochs: 10
  learning_rate: 1e-4
  lora_alpha: 8
  lora_r: 8
  lora_dropout: 0.4
  use_lora: true
  merge_tokens: 0
  num_workers: 0

# Late-fusion head fitting (svm-rbf, linear; min/max/mean are deterministic and
# always act on the unimodal scores). The learned heads are fitted on the
# held-out validation split (the unimodal models memorise train), on the
# unimodal logits, standardized. Their thresholds are tuned on out-of-fold
# validation scores (cv_folds stratified folds); the deployed head is then
# refit on the whole validation split.
training_late_fusion:
  late_fusion_input: logits  # scores or logits — feature space for the learned heads
  cv_folds: 5
  svm-rbf:  # fixed hyperparameters, no cross-validation
    C: 1.0
    gamma: 0.1
  linear:  # Linear(2, 1) trained with cross-entropy (Adam, mini-batches of batch_size);
    # 50 epochs at 1e-2 converge on the 1,000 validation samples (10 at 1e-4 do not)
    epochs: 50
    learning_rate: 1e-2

# Attack parameters (for targetted attacks)
source_label: 0  # Fake
target_label: 1  # Real

# Image attack parameters
pgd_iters: 100  # = TREPAT max_variants; union/joint get 50 + 50, joint alternates 1:1
epsilon: 1/255 # 4/255
alpha_factor: 0.4 # 0.4 # step size = epsilon / (pgd_iters * alpha_factor)
random_start: false

# TrePat attack parameters (matched to paper's final-evaluation config)
attack_model: LLAMA3B  # meta-llama/Llama-3.2-3B-Instruct, as reported in the paper.
                        # TrePat's own paper used OLMo; switching rewriters changes
                        # every TrePat result, so runs must not be mixed across models.
command: INFORMAL  # paper's best prompt for journalistic/news text (their HN task): "INFORMAL rephrasing for text from journalistic ... sources"
                   # options: REPHRASE, PARAPHRASE, SIMPLIFY, FORMAL, INFORMAL, CHANGE
max_change_total: 0.333  # discard changes modifying more than 1/3 of the whole text
max_change_fragment: 0.667  # discard changes modifying more than 2/3 of the fragment
max_variants: 100  # default query limit
min_chunk_or_sentence_length: 60  # fragments shorter than 60 characters lack context for the LLM to rephrase
responses_expected: 5  # REPHRASE prompt: "Return five different rephrasings, separated by newline"

# Bert-Attack attack parameters (matched to Li et al. 2020 original repo, cmd.txt)
k_bert_attack: 48  # number of BertAttack replacement
threshold_pred_score: 0  # 
max_words_to_attack: 1024
max_candidates_per_word: 64  # Maximum number of candidates to consider for each word in the attack
max_words_for_importance: 1024
max_change_ratio: 0.4  # Perturbable word cap hardcoded as 0.4 * len(words)
min_txt_similarity: 0.0  # Post-hoc USE semantic similarity floor (unconstrained)
use_bpe: 1  # BPE for semantic constraint presevation while replacing tokens without preserving token count

# Multimodal attack parameters
alternation_rounds: 1  # Rounds of interleaved image-PGD + text-BERTAttack (1 = single biperturbed pass)
